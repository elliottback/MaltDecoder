name: Node.js CI

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [22.x]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Download artifact smws codes
      uses: dsaltares/fetch-gh-release-asset@aa2ab1243d6e0d5b405b973c89fa4d06a2d0fff7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        file: "data.json"
        repo: "elliottback/SMWS_Codes"
        target: "./data.json"

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install stuff
      run: npm ci --ignore-scripts

    - name: build
      run: npm run ci

    - name: Install chrome
      run: npm exec -- @puppeteer/browsers install chrome@152.0.7977.82

    - name: Start Xvfb and Test
      run: |
        Xvfb :99 -screen 0 1920x1080x24 &
        export DISPLAY=:99
        npm test

    - name: Archive  artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: dist
        if-no-files-found: error
        path: |
          dist/*.png