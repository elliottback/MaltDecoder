name: Release
on:
  push:
    branches:
      - master
permissions: {}
jobs:
  release-test:
    name: Release (Test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [ 26.x ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifact smws codes
        uses: ash-shepard/fetch-gh-release-asset@v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          file: "data.json"
          repo: "elliottback/SMWS_Codes"
          target: "./data.json"

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install stuff
        run: npm ci --ignore-scripts

      - name: build
        run: npm run ci --ignore-scripts

      - name: Install chrome
        run: npx --no-install @puppeteer/browsers install chrome@152.0.7977.82

      - name: Start Xvfb and Test
        env:
          PUPPETEER_EXEC_PATH: ${{ github.workspace }}/chrome/linux-152.0.7977.82/chrome-linux64/chrome
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          npm test

      - name: Archive Test result artifacts
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: dist
          if-no-files-found: error
          path: |
            dist/*.png

  release-release:
    name: Release (Release)
    runs-on: ubuntu-latest
    needs: [ "release-test" ]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    strategy:
      matrix:
        node-version: [ 26.x ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifact smws codes
        uses: ash-shepard/fetch-gh-release-asset@v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          file: "data.json"
          repo: "elliottback/SMWS_Codes"
          target: "./data.json"

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: npx --no-install semantic-release