name: Release
on:
  push:
    branches:
      - master
permissions: {}
jobs:
  release-test:
    name: Release (Test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [ 24.x ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifact smws codes
        uses: ash-shepard/fetch-gh-release-asset@464698915cc02d0a498c92cbeb98312234a8f9b9
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          file: "data.json"
          repo: "elliottback/SMWS_Codes"
          target: "./data.json"

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install stuff
        run: npm ci --ignore-scripts

      - name: build
        run: npm run ci --ignore-scripts

      - name: Install chrome
        run: npx --no-install @puppeteer/browsers install chrome@152.0.7977.82

      - name: Start Xvfb and Test
        env:
          PUPPETEER_EXEC_PATH: ${{ github.workspace }}/chrome/linux-152.0.7977.82/chrome-linux64/chrome
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          npm test

      - name: Archive Test result artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: dist
          if-no-files-found: error
          path: |
            dist/*.png

  release-release:
    name: Release (Release)
    runs-on: ubuntu-latest
    needs: [ "release-test" ]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifact smws codes
        uses: ash-shepard/fetch-gh-release-asset@464698915cc02d0a498c92cbeb98312234a8f9b9
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          file: "data.json"
          repo: "elliottback/SMWS_Codes"
          target: "./data.json"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: npx --no-install semantic-release